name: Tommy CLI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-cli:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        cd cli
        pip install -e .
        
    - name: Test CLI Help
      run: |
        tommycli --help
        
    - name: Test CLI (Mock Dry-Run)
      run: |
        # We can't call the real OpenAI API in CI without a key, 
        # so we'll just check that the prompt file exists and parses.
        test -f COMPILER_PROMPT.md
        test -f SPECIFICATION.md
        test -f GRAMMAR.md
        echo "✅ All core files are present."