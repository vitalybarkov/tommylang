[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tommycli"
version = "0.5.0"
description = "The official compiler for the tommylang architecture blueprint."
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "lark>=1.1.0",
]

[project.scripts]
tommycli = "tommycli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tommycli*"]